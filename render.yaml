# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One-click path to a real, publicly-reachable, installable instance of the app.
# This has not been deployed and watched through a real Render account from this
# session (no such account/credentials were available here) — treat the first
# deploy as the real first test of this file, the same way the first CI run was
# the real first test of the application code. See README.md "Live deployment"
# for what to check if a service fails to come up, and the free-tier caveats
# (cold starts, the free Postgres database's 90-day expiry).

databases:
  - name: bondaudit-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: bondaudit-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bondaudit-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_ROOT
        value: /data/evidence_storage
      # Demo-deployment simplification, not a production default: the frontend never
      # sends cookies (bearer-token auth via an explicit Authorization header), so a
      # wide-open origin list can't be used to steal a session the way it could for a
      # cookie-authenticated app. Lock this to the frontend's exact origin instead if
      # this ever becomes more than a try-it-out deployment.
      - key: CORS_ORIGINS
        value: '["*"]'

  - type: web
    name: bondaudit-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      # Render's cross-service references only ever resolve to a bare hostname
      # (never a scheme) — frontend/lib/api.ts prefixes https:// itself when the
      # value it's given doesn't already start with a scheme.
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: bondaudit-backend
          property: host
