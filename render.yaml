# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One-click path to a real, publicly-reachable, installable instance of the app.
# This has not been deployed and watched through a real Render account from this
# session (no such account/credentials were available here) — treat the first
# deploy as the real first test of this file, the same way the first CI run was
# the real first test of the application code. See README.md "Live deployment"
# for what to check if a service fails to come up, and the free-tier caveats
# (cold starts, the free Postgres database's 90-day expiry).

databases:
  - name: bondaudit-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: bondaudit-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bondaudit-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_ROOT
        value: /data/evidence_storage
      # No CORS_ORIGINS override needed: the browser only ever calls the frontend's
      # own origin (see frontend/next.config.mjs's rewrite proxy below), so the
      # backend never receives a cross-origin browser request in this deployment.

  - type: web
    name: bondaudit-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      # Read server-side, at request time, by this Next.js server's rewrite proxy
      # (next.config.mjs) — never shipped to the browser, so unlike a NEXT_PUBLIC_*
      # variable it doesn't depend on anything being threaded through the Docker
      # build correctly. Render's cross-service references only ever resolve to a
      # bare hostname (never a scheme); next.config.mjs prefixes https:// itself.
      - key: INTERNAL_API_URL
        fromService:
          type: web
          name: bondaudit-backend
          property: host
