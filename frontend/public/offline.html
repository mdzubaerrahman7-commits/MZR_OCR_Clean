<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — BondAudit</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #0f172a; color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center; padding: 24px; box-sizing: border-box;
    }
    .card { max-width: 380px; }
    h1 { font-size: 1.1rem; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 0.9rem; line-height: 1.5; }
    button {
      margin-top: 16px; padding: 8px 16px; border-radius: 6px; border: none;
      background: #f8fafc; color: #0f172a; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>BondAudit needs a connection to reach the server. Reconnect and try again — nothing was lost.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
